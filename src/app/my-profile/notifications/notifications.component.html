<section class="profile-notifications-page">
      <div class="profile-notifications-card">
            <div class="profile-notifications-toggle-row">
                  <h3 class="profile-notifications-title">Turn on notifications</h3>

                  <label class="profile-notifications-switch" aria-label="Turn on notifications">
                        <input type="checkbox" [checked]="notificationsEnabled"
                              (change)="onToggleNotifications($event)" />
                        <span class="profile-notifications-slider"></span>
                  </label>
            </div>

            <p class="profile-notifications-copy mb-0">
                  Keep your notifications on to stay updated on your car search. Get alerts for new messages from
                  sellers, visit confirmations, car availability updates, and important account activity. You can turn
                  notifications off anytime if you prefer a quieter experience.
            </p>
      </div>
</section>
