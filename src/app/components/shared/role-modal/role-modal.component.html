                                                </span>
                                                <span class="role-option__text">Official Seller</span>
                                          </label>
                                    </div>

                                    <button class="btn role-modal-continue" (click)="modal.openPrivateSignUpModal()">
                                          {{ 'common.continue' | translate }}
                                    </button>
                              </div>
                        </div>

                        <div class="col-xl-7 d-none d-xl-block role-modal-visual">
                              <img src="img/login-img.jpg" class="role-modal-visual__image" alt="Seller testimonial" />
                              <div class="role-modal-quote">
                                    <p class="role-modal-quote__text">
                                          “Listing and managing cars on CarZone helped us connect with serious buyers
                                          faster.”
                                    </p>
                                    <p class="role-modal-quote__author">AutoHaus Keller</p>
                                    <p class="role-modal-quote__meta">Professional Seller · Basel</p>
                                    <p class="role-modal-quote__rating">★★★★★</p>
                              </div>
                        </div>
                  </div>
            </div>
      </div>
</div>


<div class="modal fade login-popup" id="SignInModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 overflow-hidden position-relative role-modal-shell">
                  <div class="close-btn role-modal-close" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <app-log-in />
            </div>
      </div>
</div>

<div class="modal fade login-popup" id="privateSignUpModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 overflow-hidden position-relative role-modal-shell">
                  <div class="close-btn role-modal-close" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <app-sign-up />
            </div>
      </div>
</div>

<div class="modal fade login-popup" id="ForgotPassword" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 overflow-hidden p-5 role-modal-shell position-relative">
                  <div class="close-btn role-modal-close" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <app-forgot-password />
            </div>
      </div>
</div>

<!--  Verfication Code -->
<div class="modal fade login-popup" id="VerificationCode" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 overflow-hidden p-5 position-relative role-modal-shell">
                  <div class="close-btn role-modal-close" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <app-otp-verification />
            </div>
      </div>
</div>

<div class="modal fade login-popup" id="AccountVerifiedModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered verification-status-dialog">
            <div class="modal-content border-0 rounded-4 overflow-hidden position-relative verification-status-shell">
                  <app-verification-status-modal type="private" />
            </div>
      </div>
</div>

<div class="modal fade login-popup" id="VerificationSubmittedModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered verification-status-dialog">
            <div class="modal-content border-0 rounded-4 overflow-hidden position-relative verification-status-shell">
                  <app-verification-status-modal type="company" />
            </div>
      </div>
</div>

<!--  Reset Password  -->

<div class="modal fade login-popup" id="ResetPassword" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 overflow-hidden p-5 position-relative">
                  <div class="close-btn" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <app-reset-password />
            </div>
      </div>
</div>
