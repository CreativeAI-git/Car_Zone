<div class="modal fade login-popup" id="ct_login_modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 overflow-hidden position-relative role-modal-shell">
                  <div class="close-btn role-modal-close" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i>
                  </div>
                  <div class="row g-0 role-modal-layout">
                        <div class="col-xl-5 role-modal-panel">
                              <div class="role-modal-panel__inner">
                                    <div class="role-modal-panel__brand">
                                          <img src="img/black-logo.png" class="role-modal-logo" alt="CarZone" />
                                    </div>

                                    <h2 class="role-modal-title">Choose Your Role</h2>

                                    <div class="role-modal-options">
                                          <label class="role-option" [class.role-option--active]="userType() === 'private'">
                                                <input type="radio" (change)="switchUserType($event)" name="userType" value="private"
                                                      [checked]="userType() === 'private'" />
                                                <span class="role-option__icon">
                                                      <img src="img/icons/buyer-login.png" alt="Private Individual" />
                                                </span>
                                                <span class="role-option__text">Private Individual</span>
                                          </label>

                                          <label class="role-option" [class.role-option--active]="userType() === 'company'">
                                                <input type="radio" (change)="switchUserType($event)" name="userType" value="company"
                                                      [checked]="userType() === 'company'" />
                                                <span class="role-option__icon">
                                                      <img src="img/icons/seller.png" alt="Company" />
                                                </span>
                                                <span class="role-option__text">Company</span>
                                          </label>
                                    </div>

                                    <button class="btn role-modal-continue" (click)="modal.openSignInModal()">
                                          {{ 'common.continue' | translate }}
                                    </button>
                              </div>
                        </div>

                        <div class="col-xl-7 d-none d-xl-block role-modal-visual">
                              <img src="img/login-img.jpg" class="role-modal-visual__image" alt="Seller testimonial" />
                              <div class="role-modal-quote">
                                    <p class="role-modal-quote__text">
                                          “Listing and managing cars on CarZone helped us connect with serious buyers faster.”
                                    </p>
                                    <p class="role-modal-quote__author">AutoHaus Keller</p>
                                    <p class="role-modal-quote__meta">Professional Seller · Basel</p>
                                    <p class="role-modal-quote__rating">★★★★★</p>
                              </div>
                        </div>
                  </div>
            </div>
      </div>
</div>
